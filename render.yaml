services:
  - type: web
    name: pandanumbers-api
    runtime: node
    plan: starter
    rootDir: vite-project
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    disk:
      name: pandanumbers-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_WEBHOOK_SECRET_HASH
        sync: false
      - key: ADMIN_EMAILS
        sync: false
